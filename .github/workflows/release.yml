name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APKs (Optimized & Split by ABI)
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Prepare Release Assets
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p release_assets
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_assets/Pulse-${TAG_NAME}-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_assets/Pulse-${TAG_NAME}-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/Pulse-${TAG_NAME}-universal.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/Pulse-*.apk
          name: Pulse ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
